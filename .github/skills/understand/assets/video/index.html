<!doctype html>
<!-- Generated by build-video.py from the understand skill's assets/video/index.html; edit scene.js, not this. -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{TITLE}}</title>
    <script src="assets/gsap.min.js"></script>
    <script src="timings.js"></script>
    <script src="kit.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Arial, Helvetica, sans-serif; color: #2c3539; }
      .chapter { position: absolute; inset: 0; overflow: hidden; }
      /* A registry block: a 1920x1080 sub-composition, placed and scaled into its box by the build. */
      .block { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; z-index: 5; }
      .cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
      .k-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      .k-node { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
                border: 4px solid; border-radius: 16px; font-weight: 700; line-height: 1.15; padding: 0 16px; opacity: 0; }
      .k-label { position: absolute; white-space: nowrap; opacity: 0; }
      .k-tag { position: absolute; white-space: nowrap; border: 3px solid; border-radius: 999px; padding: 10px 26px;
               font-weight: 700; opacity: 0; }
      .k-screen { position: absolute; border-radius: 12px; overflow: hidden; background: #f4f5f6;
                  box-shadow: 0 0 0 2px #d3d6d8, 0 18px 50px rgba(0, 48, 87, 0.12); opacity: 0; }
      .k-focus { position: absolute; border: 5px solid; border-radius: 10px; opacity: 0; }
      .k-code { position: absolute; margin: 0; padding: 28px 36px; border-radius: 12px; background: #f4f5f6; color: #003057;
                font-family: "JetBrains Mono", monospace; line-height: 1.45; white-space: pre; opacity: 0; }
      #captions { position: absolute; left: 160px; right: 160px; bottom: 56px; height: 150px; display: flex;
                  align-items: center; justify-content: center; }
      .k-caption { font-size: 40px; line-height: 1.35; text-align: center; color: #2c3539; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
{{AUDIO}}
{{CHAPTERS}}
{{CAPTIONS}}
    </div>
    <script src="scene.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = K.run();
    </script>
  </body>
</html>
